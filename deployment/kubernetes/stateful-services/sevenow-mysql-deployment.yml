apiVersion: v1
kind: Service
metadata:
  name: sevenow-mysql
  labels:
    name: sevenow-mysql
spec:
  ports:
  - port: 3306
    targetPort: 3306
  clusterIP: None
  selector:
    role: sevenow-mysql
---
apiVersion: apps/v1beta1
kind: StatefulSet
metadata:
  name: sevenow-mysql
spec:
  serviceName: "mysql"
  replicas: 1
  template:
    metadata:
      labels:
        role: sevenow-mysql
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: sevenow-mysql
          image: mysql:5.7
          imagePullPolicy: IfNotPresent
          args:
              - "--ignore-db-dir=lost+found"
          ports:
              - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sevenow-db-secret
                  key: root-password
            - name: MYSQL_ROOT_HOST
              value: localhost
            - name: SEVENOW_APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: sevenow-db-secret
                  key: username
            - name: SEVENOW_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sevenow-db-secret
                  key: password
            - name: SEVENOW_MIGRATOR_DB_USER
              valueFrom:
                secretKeyRef:
                  name: sevenow-db-secret
                  key: migrator-username
            - name: SEVENOW_MIGRATOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sevenow-db-secret
                  key: migrator-password
          volumeMounts:
            - name: sevenow-mysql-persistent-storage
              mountPath: /var/lib/mysql
            - name: sevenow-mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: sevenow-mysql-init
          configMap:
            name: sevenow-mysql-init
  volumeClaimTemplates:
  - metadata:
      name: sevenow-mysql-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
