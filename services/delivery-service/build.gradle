plugins {
    id "org.flywaydb.flyway" version "5.0.7"
}

apply plugin: SevenowServicePlugin
apply plugin: IntegrationTestsPlugin

dependencies {
    compile "org.springframework.boot:spring-boot-starter-web:$springBootVersion"
    compile "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"
    compile "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"
    compile "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"
    compile "org.flywaydb:flyway-core"
    compile 'mysql:mysql-connector-java:5.1.39'
    compile 'javax.el:javax.el-api:2.2.5'

    compile("io.springfox:springfox-swagger2:2.8.0") {
        exclude group: "org.springframework"
    }
    compile("io.springfox:springfox-swagger-ui:2.8.0") {
        exclude group: "org.springframework"
    }

    runtime "javax.xml.bind:jaxb-api:2.2.11"
    runtime "com.sun.xml.bind:jaxb-core:2.2.11"
    runtime "com.sun.xml.bind:jaxb-impl:2.2.11"
    runtime "javax.activation:activation:1.1.1"

    testCompile "org.springframework.boot:spring-boot-starter-test:$springBootVersion"
    testCompile 'io.rest-assured:rest-assured:3.0.6'
    testCompile 'io.rest-assured:spring-mock-mvc:3.0.6'
    testCompile "io.rest-assured:json-path:3.0.6"
}

flyway {
    url = "jdbc:mysql://${System.getenv('DOCKER_HOST_IP') ?: 'localhost'}/sevenow_delivery?useSSL=false"
    user = 'root'
    password = 'rootpassword'
    schemas = ['sevenow_delivery']
}
