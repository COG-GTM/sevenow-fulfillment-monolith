version: '3'
services:
  mysql:
    build: ./mysql
    ports:
      - "${MYSQL_PUBLISH_ADDRESS:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run '. ./set-env.sh' first}
      MYSQL_ROOT_HOST: localhost
      SEVENOW_APP_DB_USER: ${SPRING_DATASOURCE_USERNAME:?run '. ./set-env.sh' first}
      SEVENOW_APP_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?run '. ./set-env.sh' first}
      SEVENOW_MIGRATOR_DB_USER: ${FLYWAY_USER:?run '. ./set-env.sh' first}
      SEVENOW_MIGRATOR_DB_PASSWORD: ${FLYWAY_PASSWORD:?run '. ./set-env.sh' first}
  sevenow-application:
    build: ./sevenow-application
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/sevenow?useSSL=true&requireSSL=true&verifyServerCertificate=false&enabledTLSProtocols=TLSv1.2
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?run '. ./set-env.sh' first}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?run '. ./set-env.sh' first}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.jdbc.Driver
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181
      JAVA_OPTS: -Xmx192m
      SPRING_SLEUTH_ENABLED: "true"
      SPRING_SLEUTH_SAMPLER_PROBABILITY: 1
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411/
